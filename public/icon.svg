<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#6a4327"/>
      <stop offset=".65" stop-color="#3b2516"/>
      <stop offset="1" stop-color="#1d1108"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".35" stop-color="#e6c56c"/>
      <stop offset=".7" stop-color="#b8862c"/>
      <stop offset="1" stop-color="#f2d58d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8463f"/><stop offset="1" stop-color="#5a1714"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6fc4"/><stop offset="1" stop-color="#142b57"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1f4f"/><stop offset="1" stop-color="#1a0d26"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff6d0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f2d27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="84" fill="none" stroke="url(#gold)" stroke-width="6" opacity=".85"/>

  <!-- back cards -->
  <g transform="translate(206 292) rotate(-22)">
    <rect x="-92" y="-128" width="184" height="236" rx="16" fill="url(#gold)"/>
    <rect x="-82" y="-118" width="164" height="216" rx="10" fill="url(#red)"/>
  </g>
  <g transform="translate(306 292) rotate(22)">
    <rect x="-92" y="-128" width="184" height="236" rx="16" fill="url(#gold)"/>
    <rect x="-82" y="-118" width="164" height="216" rx="10" fill="url(#blue)"/>
  </g>

  <!-- front card -->
  <g transform="translate(256 262)">
    <rect x="-100" y="-140" width="200" height="256" rx="18" fill="url(#gold)" stroke="#5a400f" stroke-width="3"/>
    <rect x="-88" y="-128" width="176" height="232" rx="11" fill="url(#face)"/>
    <rect x="-80" y="-120" width="160" height="216" rx="8" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".8"/>
    <circle cx="0" cy="-12" r="92" fill="url(#glow)"/>
    <!-- four-pointed star: one point per side of a card -->
    <path d="M0,-100 C10,-40 22,-24 72,-12 C22,0 10,16 0,76 C-10,16 -22,0 -72,-12 C-22,-24 -10,-40 0,-100 Z"
          fill="url(#gold)" stroke="#6d4e17" stroke-width="3"/>
    <circle cx="0" cy="-12" r="14" fill="#fff6d0" stroke="#6d4e17" stroke-width="3"/>
  </g>
</svg>
