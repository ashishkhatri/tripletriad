name: Release

# On every push to main: if package.json has a version with no release yet,
# tag that commit vX.Y.Z and publish a GitHub release using its CHANGELOG.md section.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          awk -v t="## $TAG" 'index($0, t) == 1 {on=1; next} /^## v/ && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $TAG" > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Triad $TAG" --notes-file notes.md --latest
